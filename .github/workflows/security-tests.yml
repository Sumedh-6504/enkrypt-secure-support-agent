name: Enkrypt Security Tests

on:
  push:
    branches: ["master", "main"]
    paths:
      - 'src/**'
      - 'testing/**'
      - 'requirements.txt'
  pull_request:
    branches: ["master", "main"]
    paths:
      - 'src/**'
      - 'testing/**'
      - 'requirements.txt'

jobs:
  red-team-tdd:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
        
    - name: Run Enkrypt Red Team & Guardrail Tests
      env:
        # These are securely injected from GitHub Settings!
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        ENKRYPT_API_KEY: ${{ secrets.ENKRYPT_API_KEY }}
        ENKRYPT_POLICY_NAME: "Customer Support"
      run: |
        python -m pytest testing/test_agent.py -v
